services:
  pdf2md:
    build: .
    restart: unless-stopped
    ports:
      - "${PDF2MD_BIND_IP:-0.0.0.0}:${PDF2MD_PORT:-8000}:8000"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
